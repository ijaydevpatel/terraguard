[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraguard-ai"
version = "0.1.0"
description = "Hybrid Terraform drift, state-handling and policy-control scanner with ML-based finding prioritisation"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
terraguard = "terraguard.cli:main"

[tool.setuptools.packages.find]
include = ["terraguard*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# str+Enum is deliberate: these are serialised straight into
# CSV, and StrEnum changes what str() returns.
extend-ignore = ["UP042"]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
