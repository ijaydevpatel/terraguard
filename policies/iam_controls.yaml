# Optional controls - assessed only if the core eight are complete and time remains.
controls:
  - id: TG-P09
    name: AWS authentication uses short-lived credentials
    tier: optional
    description: Long-lived access keys in CI cannot be rotated quickly if leaked.
    evidence_source: workflow
    applies_when: a workflow authenticates to AWS
    decision: non_compliant if AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY appears
    expected_secure_result: OIDC role assumption with no stored keys
    severity_if_violated: high
    remediation: Use GitHub OIDC with a narrowly scoped role.
    source: aws-actions/configure-aws-credentials; AWS IAM best practice

  - id: TG-P11
    name: Prohibited wildcard IAM privilege is not introduced
    tier: optional
    description: An action or resource widened to "*" grants far more than intended.
    evidence_source: terraform_plan_json
    applies_to: [aws_iam]
    applies_when: a plan JSON containing IAM policy documents is available
    decision: non_compliant if an action or resource becomes a wildcard
    expected_secure_result: explicit actions on explicit resources
    severity_if_violated: critical
    remediation: Restore the least-privilege policy.
    source: AWS Config iam-policy-no-statements-with-admin-access
