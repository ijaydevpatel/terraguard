name: no-permissions-block
on: [pull_request]

# No permissions block at all, so GITHUB_TOKEN inherits the repository default.
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/terraguard-ci
          aws-region: ap-southeast-2
      - run: terraform plan -refresh-only
