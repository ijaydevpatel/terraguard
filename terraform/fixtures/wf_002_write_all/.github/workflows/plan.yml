name: write-all-token
on: [pull_request]

# Over-broad token. No artefacts published and nothing echoed, so this is a weakened
# defence rather than an exposure - rule 4.
permissions: write-all

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/terraguard-ci
          aws-region: ap-southeast-2
      - run: terraform plan -refresh-only
