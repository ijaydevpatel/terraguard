name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow reads the repository and nothing else.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the repository scanner searches past commits for state files.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # Substance before style: the security guard and the tests run first, so a
      # formatting nit never masks a real failure in the log.
      - name: State and plan file guard
        run: git ls-files | xargs python scripts/check_no_state_files.py

      - name: Tests
        run: pytest -q --cov=terraguard --cov-report=term-missing

      - name: Ruff
        run: ruff check terraguard scripts tests

      # --diff so the log shows exactly what would change, not just that something would.
      - name: Black
        run: black --check --diff terraguard scripts tests

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
